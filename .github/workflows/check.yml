name: 内容质检 / Content check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 跳板文件是否齐全且与脚本一致
        run: node _tools/setup-agents.mjs --check

      - name: 内容质检（围栏 / 链接 / 锚点 / 占位词 / 编码 / 行尾 / 图片引用）
        run: node _tools/check.mjs

      # mermaid 渲染校验需要 playwright + chromium（体积较大），
      # 设为「有依赖才跑」：缺失时脚本自行跳过并返回 0。
      - name: mermaid 图渲染校验（可选）
        run: |
          npm i -D playwright-core mermaid 2>/dev/null || true
          npx playwright install chromium 2>/dev/null || true
          node _tools/check-mermaid.mjs
        continue-on-error: false
